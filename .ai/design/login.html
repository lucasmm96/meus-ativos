<!DOCTYPE html><html class="dark" lang="pt-BR"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:wght@500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#131313;color:#e5e2e1;}body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,16px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-primary-container": "#1c4500", "on-error": "#690005", "on-background": "#e5e2e1", "surface": "#131313", "inverse-surface": "#e5e2e1", "outline": "#8a9480", "on-tertiary-fixed": "#400013", "surface-container": "#201f1f", "on-secondary-fixed": "#001a41", "inverse-on-surface": "#313030", "secondary-container": "#0162cf", "secondary-fixed-dim": "#adc6ff", "surface-container-highest": "#353534", "surface-container-lowest": "#0e0e0e", "surface-container-low": "#1c1b1b", "error-container": "#93000a", "surface-container-high": "#2a2a2a", "surface-bright": "#393939", "secondary": "#adc6ff", "on-surface-variant": "#c0cab4", "on-error-container": "#ffdad6", "tertiary-container": "#f68598", "background": "#131313", "tertiary": "#ffb2bc", "outline-variant": "#414939", "tertiary-fixed": "#ffd9dd", "primary-fixed-dim": "#8adb58", "primary-fixed": "#a5f871", "primary-container": "#6cba3b", "on-primary": "#153800", "on-primary-fixed-variant": "#225100", "inverse-primary": "#2f6c00", "tertiary-fixed-dim": "#ffb2bc", "on-secondary-container": "#dae4ff", "surface-variant": "#353534", "on-secondary": "#002e69", "error": "#ffb4ab", "primary": "#8adb58", "secondary-fixed": "#d8e2ff", "on-surface": "#e5e2e1", "surface-dim": "#131313", "on-primary-fixed": "#092100", "on-tertiary-fixed-variant": "#7e273b", "surface-tint": "#8adb58", "on-tertiary-container": "#711d31", "on-secondary-fixed-variant": "#004494", "on-tertiary": "#600f26" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter-mobile": "0.75rem", "margin-desktop": "2rem", "space-md": "1rem", "margin": "1rem", "margin-mobile": "1rem", "space-lg": "1.5rem", "gutter": "1rem", "space-xs": "0.25rem", "space-xl": "2rem", "space-sm": "0.5rem" }, "fontFamily": { "label-md": ["Inter"], "financial-numeric": ["Inter"], "label-lg": ["Inter"], "body-lg": ["Inter"], "headline-md": ["Playfair Display"], "display-lg": ["Playfair Display"], "headline-sm": ["Playfair Display"], "display-lg-mobile": ["Playfair Display"], "label-sm": ["Inter"], "body-md": ["Inter"], "headline-lg": ["Playfair Display"], "body-sm": ["Inter"] }, "fontSize": { "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.03em", "fontWeight": "500" }], "financial-numeric": ["15px", { "lineHeight": "20px", "letterSpacing": "-0.01em", "fontWeight": "500" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "0em", "fontWeight": "500" }], "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "headline-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "500" }], "display-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.05em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" }] } } } }</script><style>

</head><body class="bg-surface font-body-md text-body-md text-on-surface pt-safe pb-safe min-h-screen flex flex-col justify-center" style="background-color: rgb(18, 18, 18);"><main class="flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full max-w-md mx-auto px-margin-mobile py-space-sm items-center justify-center">
<!-- Brand / Header Section -->
<header class="flex flex-col items-center text-center mb-space-md w-full">
<div class="relative w-16 h-16 rounded-2xl bg-surface-container flex items-center justify-center shadow-lg mb-space-xs">
<div class="absolute inset-0 rounded-2xl bg-gradient-to-br from-primary/10 via-transparent to-secondary/10"></div>
<span class="material-symbols-outlined text-[32px] relative z-10" style="color: rgb(108, 186, 59); font-variation-settings: &quot;FILL&quot; 1;">candlestick_chart</span>
<div class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-secondary flex items-center justify-center shadow">
<span class="material-symbols-outlined text-surface-container-lowest text-[13px]">shield_with_heart</span>
</div>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface tracking-tight mt-1">Meus Ativos</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[240px] mt-0.5">Gestão inteligente de Renda Variável</p>
</header>
<!-- Main Authentication Card -->
<section class="w-full bg-surface-container rounded-2xl p-6 shadow-xl flex flex-col gap-4" style="background-color: #1E1E1E;">
<!-- Form Starts -->
<form class="flex flex-col gap-4 w-full" id="auth-form" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant flex items-center gap-1" for="email-input">
<span class="">E-mail</span>
</label>
<div class="relative flex items-center w-full">
<div class="absolute left-3.5 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">alternate_email</span>
</div>
<input autocomplete="email" class="w-full h-12 pl-11 pr-4 bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md rounded-xl transition-all duration-200 outline-none focus:bg-surface-container-low" id="email-input" inputmode="email" placeholder="seu.email@exemplo.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant flex items-center gap-1" for="password-input">
<span class="">Senha</span>
</label>
<div class="relative flex items-center w-full">
<div class="absolute left-3.5 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input autocomplete="current-password" class="w-full h-12 pl-11 pr-11 bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md rounded-xl transition-all duration-200 outline-none focus:bg-surface-container-low" id="password-input" placeholder="••••••••" required="" type="password">
<button aria-label="Alternar visibilidade da senha" class="absolute right-2.5 w-8 h-8 rounded-lg flex items-center justify-center text-on-surface-variant active:text-on-surface transition-colors" id="toggle-pwd-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password Row -->
<div class="flex items-center justify-between w-full pt-0.5">
<label class="flex items-center gap-2 cursor-pointer select-none group py-1">
<div class="relative flex items-center justify-center">
<input checked="" class="peer sr-only" id="remember-me" type="checkbox">
<div class="w-5 h-5 rounded bg-surface-container-lowest flex items-center justify-center peer-checked:bg-primary-container transition-all">
<span class="material-symbols-outlined text-surface-container-lowest text-[15px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant group-active:text-on-surface transition-colors">Lembrar de mim</span>
</label>
<a class="font-label-md text-label-md text-secondary hover:underline transition-all py-1" href="#recuperar">
          Esqueceu a senha?
        </a>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-primary-container active:scale-[0.98] transition-all rounded-xl text-on-primary-container font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md hover:bg-primary cursor-pointer mt-1" id="login-btn" type="submit">
<span class="">Entrar na Carteira</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Subtle Divider -->
<!-- Biometric Trigger Button -->
</section>
<!-- Registration Link & Status Footer -->
<footer class="flex flex-col items-center gap-3 mt-4 w-full">
<div class="flex items-center gap-1.5 font-body-md text-body-md text-on-surface-variant">
<span class="">Não possui conta?</span>
<a class="font-label-lg text-label-lg text-secondary underline decoration-secondary/40 hover:decoration-secondary transition-all" href="#cadastro">
        Abra sua conta
      </a>
</div>
<!-- Offline Ready Badge -->
</footer>
</div>
<script>
  (function() {
    const pwdInput = document.getElementById('password-input');
    const toggleBtn = document.getElementById('toggle-pwd-btn');
    const pwdIcon = document.getElementById('pwd-icon');

    if (toggleBtn && pwdInput && pwdIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        pwdIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    const bioBtn = document.getElementById('bio-auth-btn');
    if (bioBtn) {
      bioBtn.addEventListener('click', () => {
        bioBtn.classList.add('bg-surface-container-highest');
        setTimeout(() => {
          bioBtn.classList.remove('bg-surface-container-highest');
        }, 300);
      });
    }
  })();
</script></main>



</body></html>
