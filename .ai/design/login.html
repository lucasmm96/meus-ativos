</head><body class="bg-surface font-body-md text-body-md text-on-surface pt-safe pb-safe min-h-screen flex flex-col justify-center" style="background-color: rgb(18, 18, 18);"><main class="flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full max-w-md mx-auto px-margin-mobile py-space-sm items-center justify-center">
<!-- Brand / Header Section -->
<header class="flex flex-col items-center text-center mb-space-md w-full">
<div class="relative w-16 h-16 rounded-2xl bg-surface-container-lowest flex items-center justify-center shadow-lg mb-space-xs overflow-hidden border border-outline-variant/40"><svg class="w-12 h-12" viewBox="0 0 601 601" preserveAspectRatio="xMidYMid meet"><g transform="translate(0.000000,601.000000) scale(0.100000,-0.100000)" fill="#6cba3b"><path d="M5045 4518 c-2 -13 -37 -246 -76 -518 -99 -692 -168 -1162 -171 -1165 -2 -2 -123 112 -270 252 -219 209 -266 258 -258 272 5 9 41 49 78 90 l69 75 92 -90 c89 -85 119 -110 125 -102 4 3 134 902 132 905 -1 1 -134 -25 -296 -58 -162 -33 -365 -74 -450 -91 -85 -17 -156 -32 -158 -33 -1 -1 44 -47 100 -101 57 -54 144 -139 195 -189 l93 -90 -48 -56 c-26 -31 -175 -204 -332 -384 -157 -181 -316 -365 -355 -410 -315 -365 -445 -515 -475 -548 l-36 -39 -90 94 c-49 51 -130 136 -180 188 -49 52 -152 161 -230 242 l-140 147 -106 -122 c-338 -394 -643 -747 -858 -996 -135 -156 -249 -289 -254 -296 -8 -10 -31 5 -98 62 -48 42 -88 78 -88 82 0 6 111 136 539 631 112 129 349 405 528 613 179 207 326 377 328 377 1 0 121 -125 266 -277 145 -153 289 -305 320 -337 l56 -59 310 359 c171 197 378 438 462 534 83 96 151 177 151 181 0 3 -124 124 -275 269 -152 144 -273 265 -271 268 5 4 1637 339 1664 341 8 1 11 -7 7 -21z"></path></g></svg></div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface tracking-tight mt-1">Meus Ativos</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[240px] mt-0.5">Gestão inteligente de Renda Variável</p>
</header>
<!-- Main Authentication Card -->
<section class="w-full bg-surface-container rounded-2xl p-6 shadow-xl flex flex-col gap-4" style="background-color: #1E1E1E;">
<!-- Form Starts -->
<form class="flex flex-col gap-4 w-full" id="auth-form" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant flex items-center gap-1" for="email-input">
<span class="">E-mail</span>
</label>
<div class="relative flex items-center w-full">
<div class="absolute left-3.5 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">alternate_email</span>
</div>
<input autocomplete="email" class="w-full h-12 pl-11 pr-4 bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md rounded-xl transition-all duration-200 outline-none focus:bg-surface-container-low" id="email-input" inputmode="email" placeholder="seu.email@exemplo.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant flex items-center gap-1" for="password-input">
<span class="">Senha</span>
</label>
<div class="relative flex items-center w-full">
<div class="absolute left-3.5 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input autocomplete="current-password" class="w-full h-12 pl-11 pr-11 bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md rounded-xl transition-all duration-200 outline-none focus:bg-surface-container-low" id="password-input" placeholder="••••••••" required="" type="password">
<button aria-label="Alternar visibilidade da senha" class="absolute right-2.5 w-8 h-8 rounded-lg flex items-center justify-center text-on-surface-variant active:text-on-surface transition-colors" id="toggle-pwd-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password Row -->
<div class="flex items-center justify-between w-full pt-0.5">
<label class="flex items-center gap-2 cursor-pointer select-none group py-1">
<div class="relative flex items-center justify-center">
<input checked="" class="peer sr-only" id="remember-me" type="checkbox">
<div class="w-5 h-5 rounded bg-surface-container-lowest flex items-center justify-center peer-checked:bg-primary-container transition-all">
<span class="material-symbols-outlined text-surface-container-lowest text-[15px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant group-active:text-on-surface transition-colors">Lembrar de mim</span>
</label>
<a class="font-label-md text-label-md text-secondary hover:underline transition-all py-1" href="#recuperar">
          Esqueceu a senha?
        </a>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-primary-container active:scale-[0.98] transition-all rounded-xl text-on-primary-container font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md hover:bg-primary cursor-pointer mt-1" id="login-btn" type="submit">
<span class="">Entrar na Carteira</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button><div class="flex items-center gap-3 w-full my-1"><div class="flex-1 h-px bg-outline-variant/30"></div><span class="font-label-sm text-label-sm uppercase tracking-wider text-outline select-none">ou continue com</span><div class="flex-1 h-px bg-outline-variant/30"></div></div><button type="button" id="google-login-btn" class="w-full h-12 bg-surface-container-lowest hover:bg-surface-container-low active:scale-[0.98] transition-all rounded-xl border border-outline-variant/40 text-on-surface font-label-lg text-label-lg flex items-center justify-center gap-3 shadow cursor-pointer"><svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"></path><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"></path><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"></path><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"></path></svg><span class="">Continuar com o Google</span></button>
</form>
<!-- Subtle Divider -->
<!-- Biometric Trigger Button -->
</section>
<!-- Registration Link & Status Footer -->
<footer class="flex flex-col items-center gap-3 mt-4 w-full">
<div class="flex items-center gap-1.5 font-body-md text-body-md text-on-surface-variant">
<span class="">Não possui conta?</span>
<a class="font-label-lg text-label-lg text-secondary underline decoration-secondary/40 hover:decoration-secondary transition-all" href="#cadastro">
        Abra sua conta
      </a>
</div>
<!-- Offline Ready Badge -->
</footer>
</div>
<script>
  (function() {
    const pwdInput = document.getElementById('password-input');
    const toggleBtn = document.getElementById('toggle-pwd-btn');
    const pwdIcon = document.getElementById('pwd-icon');

    if (toggleBtn && pwdInput && pwdIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        pwdIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    const bioBtn = document.getElementById('bio-auth-btn');
    if (bioBtn) {
      bioBtn.addEventListener('click', () => {
        bioBtn.classList.add('bg-surface-container-highest');
        setTimeout(() => {
          bioBtn.classList.remove('bg-surface-container-highest');
        }, 300);
      });
    }
  })();
</script></main>



</body></html>
