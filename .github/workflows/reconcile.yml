name: Reconciliação Mensal COTAHIST

on:
  schedule:
    # Dia 5 de cada mês às 03:00 UTC — arquivo mensal da B3 já disponível
    - cron: '0 3 5 * *'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ingestao/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/ingestao/requirements.txt

      - name: Reconciliar mês anterior
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RECONCILE: "true"
        run: python scripts/ingestao/main.py
