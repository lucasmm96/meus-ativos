name: Ingestão COTAHIST

on:
  schedule:
    # 01:00 UTC = 22:00 BRT — COTAHIST D file is typically published by 20:00 BRT
    - cron: '0 1 * * 2-6'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ingestao/requirements.txt
      - name: Install dependencies
        run: pip install -r scripts/ingestao/requirements.txt
      - name: Run ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/ingestao/main.py
