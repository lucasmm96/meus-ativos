name: Backfill COTAHIST Histórico

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ingestao/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/ingestao/requirements.txt

      - name: Executar backfill histórico completo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKFILL_ALL: "true"
        run: python scripts/ingestao/main.py
